<main><h1>Slide 06｜Suica與PASMO：方便，但不是萬用票。</h1>
<p>理解「先儲值、可感應」的原則與限制。</p>
<ul>
<li><strong>用途</strong>：多種鐵路、公車及部分船舶支援預付IC卡。</li>
<li><strong>小額支付</strong>：部分便利商店、自販機與計程車也可能接受。</li>
<li><strong>卡片種類</strong>：有地區品牌與訪客產品，供應與規則可能調整。</li>
<li><strong>使用邊界</strong>：特殊列車、跨區行程及個別路線，需核對業者規定。</li>
</ul>
<p>引用：S003, S002；證據卡：<a href="../cards/card-06.html">card-06</a>。</p>
