<main><h1>Slide 04｜出發前，用四個區塊檢查自己。</h1>
<p>這是教學示例，不是官方列出的強制清單。</p>
<ul>
<li><strong>旅行條件</strong>：依護照與目的確認入境資格，查詢最新官方資料。</li>
<li><strong>聯絡與設備</strong>：準備住宿聯絡方式，查手機連線及充電器規格。</li>
<li><strong>付款方案</strong>：知道日圓與不同支付方式，別假設所有商家都能刷卡。</li>
<li><strong>行程與天候</strong>：把住宿、交通與天氣預報放到同一張表。</li>
</ul>
<p>引用：S001；證據卡：<a href="../cards/card-04.html">card-04</a>。</p>
